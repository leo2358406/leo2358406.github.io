<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desert Bull Dodge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(
                    180deg,
                    #87ceeb 0%,
                    #c7e9f5 35%,
                    #ead09a 100%
                );
            color: #3d2817;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin: 5px 0 5px;
            color: #8b4513;
            font-size: clamp(28px, 5vw, 48px);
            text-shadow: 1px 2px 0 rgba(255, 255, 255, 0.5);
        }

        .subtitle {
            margin: 0 0 15px;
            font-size: clamp(14px, 2vw, 18px);
        }

        .game-container {
            position: relative;
            width: min(100%, 1000px);
            aspect-ratio: 4 / 3;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 5px solid #8b4513;
            border-radius: 12px;
            background: #000;
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.3),
                0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .game-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .instructions {
            width: min(100%, 700px);
            margin: 0 auto 20px;
            padding: 12px 18px;
            background: rgba(255, 248, 220, 0.9);
            border: 2px solid #b8860b;
            border-radius: 10px;
            font-size: 15px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #8b4513;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 7px;
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .back-button:hover {
            background: #6f3510;
            transform: translateY(-1px);
        }

        .back-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <main class="page">

        <h1>🌵 Desert Bull Dodge 🐂</h1>

        <p class="subtitle">
            Dodge the bulls, switch lanes, and survive as long as you can!
        </p>

        <div class="game-container">
            <iframe
                src="game/"
                title="Desert Bull Dodge"
                allow="fullscreen"
                allowfullscreen
            ></iframe>
        </div>

        <div class="instructions">
            <strong>Controls:</strong>
            Use <strong>A / D</strong> or
            <strong>← / →</strong> to switch lanes.
            Press <strong>SPACE</strong> to start and restart.
        </div>

        <a class="back-button" href="index.html">
            ← Back to Projects
        </a>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Desert Bull Dodge</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            margin: 20px 0 10px;
        }

        .game-container {
            width: min(100%, 1000px);
            aspect-ratio: 4 / 3;
        }

        .game-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <h1>Desert Bull Dodge</h1>

    <div class="game-container">
        <iframe
            src="game/"
            title="Desert Bull Dodge"
            allow="fullscreen"
        ></iframe>
    </div>

</body>
</html>
